<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJK Spin Wheel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #09090d;
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .app { width: min(1100px, 100%); }
  h1 { text-align: center; margin: 0 0 6px; font-size: 38px; }
  .sub { text-align: center; color: #aaa; margin: 0 0 22px; }
  .tabs {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-bottom: 20px;
  }
  .tab, button {
    border: 0; border-radius: 10px; padding: 11px 15px;
    background: #202027; color: #fff; cursor: pointer; font-weight: 700;
  }
  .tab.active, button:hover { background: #6d28d9; }
  .layout {
    display: grid; grid-template-columns: 1fr 330px; gap: 22px;
    align-items: start;
  }
  .card {
    background: #121219; border: 1px solid #292934;
    border-radius: 18px; padding: 18px;
  }
  .wheel-wrap {
    position: relative; width: min(620px, 100%); aspect-ratio: 1;
    margin: auto;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 17px solid transparent;
    border-right: 17px solid transparent; border-top: 30px solid #fff;
    filter: drop-shadow(0 2px 3px #000);
  }
  .topbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .fullscreen-btn { background: #202027; }
  .spin {
    display: block; margin: 16px auto 4px; font-size: 20px;
    padding: 14px 34px; background: #7c3aed;
  }
  .spin:disabled { opacity: .55; cursor: not-allowed; }
  .result {
    text-align: center; min-height: 54px; padding-top: 10px;
  }
  .result small { color: #aaa; }
  .result strong { display: block; font-size: 27px; margin-top: 4px; }
  .side h2 { margin-top: 0; }
  textarea {
    width: 100%; min-height: 250px; resize: vertical;
    background: #09090d; color: #fff; border: 1px solid #343441;
    border-radius: 10px; padding: 12px; line-height: 1.45;
  }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { flex: 1; }
  .hint { color: #999; font-size: 13px; line-height: 1.4; }
  .final-screen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #09090d;
    overflow-y: auto;
    padding: 28px;
  }
  .final-inner { width: min(1000px, 100%); margin: auto; }
  .final-title { text-align: center; font-size: 42px; margin: 0 0 8px; }
  .final-sub { text-align: center; color: #aaa; margin: 0 0 24px; }
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
  }
  .result-card {
    background: #121219;
    border: 1px solid #292934;
    border-radius: 14px;
    padding: 16px;
  }
  .result-card .label { color: #aaa; font-size: 13px; }
  .result-card .value { font-size: 21px; font-weight: 800; margin-top: 6px; }
  .final-actions { display: flex; justify-content: center; gap: 10px; margin-top: 24px; }
  .final-actions button { font-size: 16px; }
  @media (max-width: 600px) {
    .final-title { font-size: 32px; }
    .final-screen { padding: 18px; }
  }
  .ending-screen {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: #08080c; overflow-y: auto; padding: 28px;
  }
  .ending-screen.show { display: block; }
  .ending-inner { max-width: 900px; margin: 0 auto; }
  .ending-title { text-align: center; font-size: 42px; margin: 5px 0 8px; }
  .ending-sub { text-align: center; color: #aaa; margin-bottom: 24px; }
  .build-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .build-card {
    background: #121219; border: 1px solid #292934; border-radius: 14px;
    padding: 15px;
  }
  .build-card span { display: block; color: #999; font-size: 13px; margin-bottom: 5px; }
  .build-card strong { font-size: 20px; }
  .ending-actions { display: flex; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .ending-actions button { background: #7c3aed; padding: 13px 20px; }
  .ending-actions .secondary { background: #202027; }
  @media (max-width: 600px) {
    .build-grid { grid-template-columns: 1fr; }
    .ending-title { font-size: 32px; }
  }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><button class="fullscreen-btn" id="fullscreenBtn">⛶ Fullscreen</button></div>
  <h1>⚡ JJK Spin Wheel</h1>
  <p class="sub">Build your own Jujutsu Kaisen character</p>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <section class="card">
      <div class="wheel-wrap">
        <canvas id="wheel" width="700" height="700" aria-label="Spin wheel"></canvas>
        <div class="pointer"></div>
      </div>
      <button class="spin" id="spinBtn">SPIN 🎡</button>
<button class="spin" id="spinAllBtn" style="background:#b91c1c">SPIN ALL WHEELS 🔥</button>
      <div class="result" id="result">
        <small>Selected category</small>
        <strong>Ready!</strong>
      </div>
    </section>

    <aside class="card side">
      <h2 id="editorTitle">Stamina</h2>
      <p class="hint">Edit the entries if you want. Put one result on each line.</p>
      <textarea id="entries"></textarea>
      <div class="actions">
        <button id="applyBtn">Apply</button>
        <button id="resetBtn">Reset</button>
      </div>
    </aside>
  </div>

  <div class="final-screen" id="finalScreen">
    <div class="final-inner">
      <h1 class="final-title">🔥 Your JJK Character 🔥</h1>
      <p class="final-sub">Your final wheel results</p>
      <div class="results-grid" id="finalResults"></div>
      <div id="ctResults" style="margin-top:18px"></div>
      <div class="final-actions">
        <button id="closeFinalBtn">Back to Wheels</button>
        <button id="resetBuildBtn">Reset Build</button>
      </div>
    </div>
  </div>
</div>

<script>
const wheels = {
  "Characters": [
    "Gojo","Sukuna","Toji","Yuji","Megumi","Yuta","Maki","Hakari","Kashimo",
    "Geto","Kenjaku","Mahito","Jogo","Dagon","Hanami","Choso","Todo","Nanami",
    "Nobara","Inumaki","Mei Mei","Ui Ui","Naoya","Naobito","Yorozu","Uraume",
    "Higuruma","Takaba","Miguel","Kusakabe","Panda","Miwa","Mai","Shoko",
    "Utahime","Angel","Uro","Ryu","Reggie","Dhruv"
  ],
  "Strength": [
    "Sukuna","Gojo","Toji","Maki","Yuji","Yuta","Hakari","Kashimo",
    "Ryu","Todo","Jogo","Mahito","Choso","Naoya","Naobito","Miguel",
    "Hanami","Dagon","Uraume","Higuruma"
  ],
  "Battle IQ": [
    "Sukuna","Gojo","Kenjaku","Toji","Yuta","Megumi","Todo","Maki",
    "Hakari","Kashimo","Higuruma","Yorozu","Mahito","Naobito","Naoya",
    "Choso","Geto","Mei Mei","Nanami","Uro"
  ],
  "Stamina": [
    "Sukuna","Gojo","Yuta","Hakari","Yuji","Maki","Toji","Kashimo",
    "Choso","Mahito","Kenjaku","Geto","Todo","Nanami","Megumi",
    "Uraume","Jogo","Hanami","Dagon","Higuruma"
  ],
  "Speed": [
    "Sukuna","Gojo","Toji","Maki","Naobito","Naoya","Yuji","Yuta",
    "Kashimo","Hakari","Megumi","Todo","Mahito","Jogo","Uraume",
    "Choso","Miguel","Uro","Ryu","Kenjaku"
  ],
  "IQ": [
    "Kenjaku","Sukuna","Gojo","Yuta","Megumi","Geto","Higuruma",
    "Mei Mei","Kusakabe","Nanami","Shoko","Todo","Hakari","Uraume",
    "Yorozu","Uro","Reggie","Mahito","Choso","Maki"
  ],
  "Durability": [
    "Sukuna","Gojo","Yuji","Maki","Toji","Yuta","Hakari","Mahito",
    "Hanami","Jogo","Dagon","Ryu","Kashimo","Choso","Todo","Uraume",
    "Kenjaku","Geto","Megumi","Higuruma"
  ],
  "Cursed Technique": [
    "Limitless","Ten Shadows Technique","Shrine","Copy","Blood Manipulation",
    "Cursed Speech","Boogie Woogie","Idle Transfiguration",
    "Cursed Spirit Manipulation","Straw Doll Technique","Ratio Technique",
    "Projection Sorcery","Construction","Comedian","Star Rage",
    "Sky Manipulation","Mythical Beast Amber","Antigravity System",
    "Technique Extinguishment","Ice Formation","Puppet Manipulation",
    "Black Bird Manipulation","Auspicious Beasts Summon","Rot Technique",
    "Inverse","Contractual Re Creation","Judgeman","Love Rendezvous",
    "Tool Manipulation","Cloning Technique"
  ],
  "Domains": [
    "Malevolent Shrine",
    "Unlimited Void",
    "Chimera Shadow Garden",
    "Self Embodiment of Perfection",
    "Coffin of the Iron Mountain",
    "Horizon of the Captivating Skandha",
    "Idle Death Gamble",
    "Deadly Sentencing",
    "Time Cell Moon Palace",
    "Authentic Mutual Love",
    "Womb Profusion",
    "Threefold Affliction",
    "Smallpox Deity's Domain",
    "Yuji Itadori's Domain"
  ]
};

const defaults = JSON.parse(JSON.stringify(wheels));
let current = "Stamina";
let entries = [...wheels[current]];
let rotation = 0;
let spinning = false;
const buildResults = {};

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const tabs = document.getElementById("tabs");
const textarea = document.getElementById("entries");
const title = document.getElementById("editorTitle");
const result = document.getElementById("result");
const spinBtn = document.getElementById("spinBtn");

function buildTabs() {
  tabs.innerHTML = "";
  Object.keys(wheels).forEach(name => {
    const b = document.createElement("button");
    b.className = "tab" + (name === current ? " active" : "");
    b.textContent = name;
    b.onclick = () => selectWheel(name);
    tabs.appendChild(b);
  });
}

function selectWheel(name) {
  current = name;
  entries = [...wheels[name]];
  title.textContent = name;
  textarea.value = entries.join("\\n");
  result.innerHTML = "<small>Selected category</small><strong>Ready!</strong>";
  buildTabs();
  draw();
}

function draw() {
  const n = entries.length;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const r = 320;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  const slice = (Math.PI * 2) / Math.max(n, 1);
  for (let i = 0; i < n; i++) {
    const a0 = i * slice;
    const a1 = a0 + slice;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,a0,a1);
    ctx.closePath();
    ctx.fillStyle = `hsl(${(i * 360 / n) % 360} 70% 48%)`;
    ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.rotate(a0 + slice/2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = n > 25 ? "bold 12px Arial" : "bold 16px Arial";
    let text = entries[i];
    if (text.length > 25) text = text.slice(0, 24) + "…";
    ctx.fillText(text, r - 12, 5);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(0,0,55,0,Math.PI*2);
  ctx.fillStyle = "#111";
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.restore();
}

function spin() {
  if (spinning || entries.length < 1) return;
  spinning = true;
  spinBtn.disabled = true;

  const n = entries.length;
  const slice = 2 * Math.PI / n;
  const winner = Math.floor(Math.random() * n);

  const targetCenter = -(winner * slice + slice / 2) + Math.PI * 1.5;
  const start = rotation;
  const turns = 7 + Math.random() * 3;
  const target = targetCenter + turns * Math.PI * 2;
  const duration = 4200;
  const t0 = performance.now();

  function animate(now) {
    const p = Math.min((now - t0) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 4);
    rotation = start + (target - start) * eased;
    draw();
    if (p < 1) requestAnimationFrame(animate);
    else {
      rotation = target % (Math.PI * 2);
      draw();
      result.innerHTML = `<small>${current}</small><strong>${entries[winner]}</strong>`;
      buildResults[current] = entries[winner];
      spinning = false;
      spinBtn.disabled = false;
      checkComplete();
    }
  }
  requestAnimationFrame(animate);
}

document.getElementById("applyBtn").onclick = () => {
  const list = textarea.value.split("\\n").map(x => x.trim()).filter(Boolean);
  if (!list.length) return;
  wheels[current] = list;
  entries = [...list];
  result.innerHTML = "<small>Updated</small><strong>Ready!</strong>";
  draw();
};

document.getElementById("resetBtn").onclick = () => {
  wheels[current] = [...defaults[current]];
  entries = [...wheels[current]];
  textarea.value = entries.join("\\n");
  result.innerHTML = "<small>Reset</small><strong>Ready!</strong>";
  draw();
};

const fullscreenBtn = document.getElementById("fullscreenBtn");
fullscreenBtn.onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
      fullscreenBtn.textContent = "✕ Exit Fullscreen";
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {}
};

document.addEventListener("fullscreenchange", () => {
  fullscreenBtn.textContent = document.fullscreenElement
    ? "✕ Exit Fullscreen"
    : "⛶ Fullscreen";
});

const buildResults = {};

function updateEnding() {
  const grid = document.getElementById("buildGrid");
  grid.innerHTML = "";
  const order = ["Characters","Stamina","Speed","IQ","Durability","Cursed Technique","Domains","Strength","Battle IQ"];
  order.forEach(name => {
    if (buildResults[name]) {
      const card = document.createElement("div");
      card.className = "build-card";
      card.innerHTML = `<span>${name}</span><strong>${buildResults[name]}</strong>`;
      grid.appendChild(card);
    }
  });
}

function checkComplete() {
  const needed = Object.keys(wheels);
  if (needed.every(name => buildResults[name])) {
    updateEnding();
    document.getElementById("endingScreen").classList.add("show");
  }
}

document.getElementById("spinAgainBtn").onclick = () => {
  document.getElementById("endingScreen").classList.remove("show");
  Object.keys(buildResults).forEach(k => delete buildResults[k]);
  result.innerHTML = "<small>Selected category</small><strong>Ready!</strong>";
  buildTabs();
};

document.getElementById("closeEndingBtn").onclick = () => {
  document.getElementById("endingScreen").classList.remove("show");
};

function showFinalScreen() {
  const finalScreen = document.getElementById("finalScreen");
  const finalResults = document.getElementById("finalResults");
  finalResults.innerHTML = "";
  Object.keys(wheels).forEach(name => {
    if (name === "Cursed Technique") return;
    const card = document.createElement("div");
    card.className = "result-card";
    card.innerHTML = `<div class="label">${name}</div><div class="value">${buildResults[name] || "Not spun"}</div>`;
    finalResults.appendChild(card);
  });

  const ctResults = document.getElementById("ctResults");
  ctResults.innerHTML = `<div class="results-grid">
    ${[1,2,3].map(i => `<div class="result-card"><div class="label">Cursed Technique ${i}</div><div class="value">${buildResults["Cursed Technique " + i] || "Not spun"}</div></div>`).join("")}
  </div>`;
  finalScreen.style.display = "block";
}

function allWheelsSpun() {
  return Object.keys(wheels).every(name => name === "Cursed Technique" || buildResults[name])
    && buildResults["Cursed Technique 1"]
    && buildResults["Cursed Technique 2"]
    && buildResults["Cursed Technique 3"];
}


async function spinThreeCTs() {
  const ctList = [...wheels["Cursed Technique"]];
  const results = [];

  for (let i = 0; i < 3; i++) {
    current = "Cursed Technique";
    entries = [...ctList];
    title.textContent = `Cursed Technique ${i + 1}`;
    textarea.value = entries.join("\n");
    buildTabs();

    await new Promise(resolve => {
      const n = entries.length;
      const slice = 2 * Math.PI / n;
      const winner = Math.floor(Math.random() * n);
      spinning = true;
      spinBtn.disabled = true;
      document.getElementById("spinAllBtn").disabled = true;

      const start = rotation;
      const targetCenter = -(winner * slice + slice / 2) + Math.PI * 1.5;
      const target = targetCenter + (7 + Math.random() * 2) * Math.PI * 2;
      const duration = 1800;
      const t0 = performance.now();

      function animate(now) {
        const p = Math.min((now - t0) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 4);
        rotation = start + (target - start) * eased;
        draw();

        if (p < 1) {
          requestAnimationFrame(animate);
        } else {
          rotation = target % (Math.PI * 2);
          draw();
          results.push(entries[winner]);
          result.innerHTML = `<small>Cursed Technique ${i + 1}</small><strong>${entries[winner]}</strong>`;
          spinning = false;
          resolve();
        }
      }
      requestAnimationFrame(animate);
    });

    await new Promise(r => setTimeout(r, 250));
  }

  buildResults["Cursed Technique 1"] = results[0];
  buildResults["Cursed Technique 2"] = results[1];
  buildResults["Cursed Technique 3"] = results[2];
}

async function spinOneWheel(name) {
  selectWheel(name);
  return new Promise(resolve => {
    const n = entries.length;
    const slice = 2 * Math.PI / n;
    const winner = Math.floor(Math.random() * n);

    spinning = true;
    spinBtn.disabled = true;
    document.getElementById("spinAllBtn").disabled = true;

    const start = rotation;
    const targetCenter = -(winner * slice + slice / 2) + Math.PI * 1.5;
    const target = targetCenter + (7 + Math.random() * 2) * Math.PI * 2;
    const duration = 2200;
    const t0 = performance.now();

    function animate(now) {
      const p = Math.min((now - t0) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 4);
      rotation = start + (target - start) * eased;
      draw();

      if (p < 1) {
        requestAnimationFrame(animate);
      } else {
        rotation = target % (Math.PI * 2);
        draw();
        buildResults[name] = entries[winner];
        result.innerHTML = `<small>${name}</small><strong>${entries[winner]}</strong>`;
        spinning = false;
        spinBtn.disabled = false;
        document.getElementById("spinAllBtn").disabled = false;
        resolve(entries[winner]);
      }
    }
    requestAnimationFrame(animate);
  });
}

spinBtn.onclick = () => {
  if (!spinning) spinOneWheel(current);
};

document.getElementById("spinAllBtn").onclick = async () => {
  if (spinning) return;

  const names = Object.keys(wheels);
  document.getElementById("spinAllBtn").disabled = true;
  spinBtn.disabled = true;

  for (const name of names) {
    if (name === "Cursed Technique") {
      await spinThreeCTs();
    } else {
      await spinOneWheel(name);
    }
    await new Promise(r => setTimeout(r, 350));
  }

  document.getElementById("spinAllBtn").disabled = false;
  spinBtn.disabled = false;
  setTimeout(showFinalScreen, 500);
};


document.getElementById("closeFinalBtn").onclick = () => {
  document.getElementById("finalScreen").style.display = "none";
};

document.getElementById("resetBuildBtn").onclick = () => {
  Object.keys(buildResults).forEach(k => delete buildResults[k]);
  document.getElementById("ctResults").innerHTML = "";
  document.getElementById("finalScreen").style.display = "none";
  result.innerHTML = "<small>Selected category</small><strong>Ready!</strong>";
};

buildTabs();
selectWheel("Stamina");
</script>
<div class="ending-screen" id="endingScreen">
  <div class="ending-inner">
    <h1 class="ending-title">🔥 YOUR JJK BUILD 🔥</h1>
    <p class="ending-sub">Character build complete!</p>
    <div class="build-grid" id="buildGrid"></div>
    <div class="ending-actions">
      <button id="spinAgainBtn">Spin Again 🎡</button>
      <button class="secondary" id="closeEndingBtn">Back to Wheel</button>
    </div>
  </div>
</div>

</body>
</html>
