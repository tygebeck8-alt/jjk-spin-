<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JJK Spin Wheel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090f;color:#fff;font-family:Arial,sans-serif}
button{border:0;border-radius:12px;padding:12px 18px;color:#fff;background:#252532;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:1200px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{text-align:center;margin:8px 0 4px;font-size:38px}
.subtitle{text-align:center;color:#aaa;margin:0 0 18px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:18px}
.tab.active{background:#7c3aed}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}
.card{background:#12121b;border:1px solid #2b2b38;border-radius:18px;padding:18px}
.wheelbox{position:relative;width:min(650px,100%);aspect-ratio:1;margin:auto}.small-pointer{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:20px;color:#fff;z-index:3;text-shadow:0 2px 4px #000}
canvas{width:100%;height:100%;display:block}

.spin{display:block;margin:14px auto 8px;background:#7c3aed;font-size:20px;padding:14px 32px}
.spinall{display:block;margin:8px auto;background:#c62828;font-size:18px;padding:13px 28px}
.result{text-align:center;min-height:58px;margin-top:8px}
.result small{color:#aaa}.result strong{display:block;font-size:27px;margin-top:4px}
textarea{width:100%;min-height:300px;background:#08080d;color:#fff;border:1px solid #383846;border-radius:12px;padding:12px;line-height:1.45}
.actions{display:flex;gap:8px;margin-top:9px}.actions button{flex:1}
.hint{color:#999;font-size:13px;line-height:1.4}
.final{display:none;position:fixed;inset:0;background:#08080d;z-index:20;overflow:auto;padding:25px}
.finalinner{max-width:1000px;margin:auto}
.final h2{text-align:center;font-size:42px;margin:10px 0}
.final p{text-align:center;color:#aaa}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:20px}
.r{background:#14141e;border:1px solid #30303d;border-radius:14px;padding:16px}
.r small{color:#aaa}.r strong{display:block;font-size:21px;margin-top:6px}
.finalbuttons{display:flex;justify-content:center;gap:10px;margin-top:24px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{order:2}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span>⚡ JJK Character Builder</span>
    <button id="fullBtn">⛶ Fullscreen</button>
  </div>
  <h1>JJK Spin Wheel 🎡</h1>
  <p class="subtitle">Build your own Jujutsu Kaisen character</p>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <main class="card">
      <div class="wheelbox">
        <canvas id="wheel" width="700" height="700"></canvas><div class="small-pointer">▼</div>
        
      </div>
      <button class="spin" id="spinBtn">SPIN 🎡</button>
      <button class="spinall" id="allBtn">SPIN ALL WHEELS 🔥</button>
      <div class="result" id="result"><small>Selected category</small><strong>Ready!</strong></div>
    </main>

    <aside class="card side">
      <h2 id="editTitle">Characters</h2>
      <p class="hint">One entry per line. You can edit a wheel and press Apply.</p>
      <textarea id="entries"></textarea>
      <div class="actions">
        <button id="apply">Apply</button>
        <button id="reset">Reset</button>
      </div>
    </aside>
  </div>
</div>

<div class="final" id="final">
  <div class="finalinner">
    <h2>🔥 Your JJK Character 🔥</h2>
    <p>Final character build</p>
    <div class="grid" id="results"></div>
    <div class="finalbuttons">
      <button id="back">Back to Wheels</button>
      <button id="newBuild">New Build</button>
    </div>
  </div>
</div>

<script>
const DEFAULTS={
"Characters":["Gojo","Sukuna","Toji","Yuji","Megumi","Yuta","Maki","Hakari","Kashimo","Geto","Kenjaku","Mahito","Jogo","Dagon","Hanami","Choso","Todo","Nanami","Nobara","Inumaki","Mei Mei","Ui Ui","Naoya","Naobito","Yorozu","Uraume","Higuruma","Takaba","Miguel","Kusakabe","Panda","Miwa","Mai","Shoko","Utahime","Angel","Uro","Ryu","Reggie","Dhruv"],
"Strength":["Sukuna","Gojo","Toji","Maki","Yuji","Yuta","Hakari","Kashimo","Ryu","Todo","Jogo","Mahito","Choso","Naoya","Naobito","Miguel","Hanami","Dagon","Uraume","Higuruma"],
"Battle IQ":["Sukuna","Gojo","Kenjaku","Toji","Yuta","Megumi","Todo","Maki","Hakari","Kashimo","Higuruma","Yorozu","Mahito","Naobito","Naoya","Choso","Geto","Mei Mei","Nanami","Uro"],
"Stamina":["Sukuna","Gojo","Yuta","Hakari","Yuji","Maki","Toji","Kashimo","Choso","Mahito","Kenjaku","Geto","Todo","Nanami","Megumi","Uraume","Jogo","Hanami","Dagon","Higuruma"],
"Speed":["Sukuna","Gojo","Toji","Maki","Naobito","Naoya","Yuji","Yuta","Kashimo","Hakari","Megumi","Todo","Mahito","Jogo","Uraume","Choso","Miguel","Uro","Ryu","Kenjaku"],
"IQ":["Kenjaku","Sukuna","Gojo","Yuta","Megumi","Geto","Higuruma","Mei Mei","Kusakabe","Nanami","Shoko","Todo","Hakari","Uraume","Yorozu","Uro","Reggie","Mahito","Choso","Maki"],
"Durability":["Sukuna","Gojo","Yuji","Maki","Toji","Yuta","Hakari","Mahito","Hanami","Jogo","Dagon","Ryu","Kashimo","Choso","Todo","Uraume","Kenjaku","Geto","Megumi","Higuruma"],
"Cursed Technique":["Limitless","Ten Shadows Technique","Shrine","Copy","Blood Manipulation","Cursed Speech","Boogie Woogie","Idle Transfiguration","Cursed Spirit Manipulation","Straw Doll Technique","Ratio Technique","Projection Sorcery","Construction","Comedian","Star Rage","Sky Manipulation","Mythical Beast Amber","Antigravity System","Technique Extinguishment","Ice Formation","Puppet Manipulation","Black Bird Manipulation","Auspicious Beasts Summon","Rot Technique","Inverse","Contractual Re Creation","Judgeman","Love Rendezvous","Tool Manipulation","Cloning Technique"],
"Domains":["Malevolent Shrine","Unlimited Void","Chimera Shadow Garden","Self Embodiment of Perfection","Coffin of the Iron Mountain","Horizon of the Captivating Skandha","Idle Death Gamble","Deadly Sentencing","Time Cell Moon Palace","Authentic Mutual Love","Womb Profusion","Threefold Affliction","Smallpox Deity's Domain","Yuji Itadori's Domain"]
};

const data=JSON.parse(JSON.stringify(DEFAULTS));
const tabs=document.getElementById("tabs"), canvas=document.getElementById("wheel"), ctx=canvas.getContext("2d");
const entriesBox=document.getElementById("entries"), editTitle=document.getElementById("editTitle"), result=document.getElementById("result");
const spinBtn=document.getElementById("spinBtn"), allBtn=document.getElementById("allBtn");
let current="Characters", rotation=0, spinning=false;
const build={};

function makeTabs(){
  tabs.innerHTML="";
  Object.keys(data).forEach(name=>{
    const b=document.createElement("button");
    b.textContent=name;b.className="tab"+(name===current?" active":"");
    b.onclick=()=>select(name);tabs.appendChild(b);
  });
}
function select(name){
  current=name;editTitle.textContent=name;entriesBox.value=data[name].join("\n");
  result.innerHTML="<small>"+name+"</small><strong>Ready!</strong>";makeTabs();draw();
}
function draw(){
  const list=data[current], n=list.length, cx=350, cy=350, r=320;
  ctx.clearRect(0,0,700,700);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);
  const step=2*Math.PI/n;
  list.forEach((txt,i)=>{
    const a=i*step;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,a+step);ctx.closePath();
    ctx.fillStyle="hsl("+(i*360/n)+" 70% 48%)";ctx.fill();
    ctx.strokeStyle="#111";ctx.stroke();
    ctx.save();ctx.rotate(a+step/2);ctx.textAlign="right";ctx.fillStyle="#fff";
    ctx.font=n>25?"bold 12px Arial":"bold 15px Arial";
    let s=txt;if(s.length>25)s=s.slice(0,24)+"…";
    ctx.fillText(s,r-10,5);ctx.restore();
  });
  ctx.beginPath();ctx.arc(0,0,52,0,Math.PI*2);ctx.fillStyle="#111";ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();ctx.restore();
}
function spinWheel(name,duration=1900){
  return new Promise(resolve=>{
    select(name);const list=data[name],n=list.length,step=2*Math.PI/n;
    const winner=Math.floor(Math.random()*n),start=rotation;
    const pointerAngle=-Math.PI/2; const targetCenter=pointerAngle-(winner*step+step/2); const extraTurns=7+Math.floor(Math.random()*3); const target=targetCenter+extraTurns*Math.PI*2;
    const t0=performance.now();spinning=true;spinBtn.disabled=true;allBtn.disabled=true;
    function frame(now){
      const p=Math.min((now-t0)/duration,1),e=1-Math.pow(1-p,4);
      rotation=start+(target-start)*e;draw();
      if(p<1)requestAnimationFrame(frame);
      else{rotation=target%(2*Math.PI);draw();build[name]=list[winner];result.innerHTML="<small>"+name+" • WHEEL PICKED</small><strong>"+list[winner]+"</strong>";spinning=false;spinBtn.disabled=false;allBtn.disabled=false;resolve(list[winner]);}
    }
    requestAnimationFrame(frame);
  });
}
spinBtn.onclick=()=>{if(!spinning)spinWheel(current);};

allBtn.onclick=async()=>{
  if(spinning)return;
  allBtn.disabled=true;spinBtn.disabled=true;
  for(const name of Object.keys(data)){
    if(name==="Cursed Technique")continue;
    await spinWheel(name,1100);await new Promise(r=>setTimeout(r,150));
  }
  build["Cursed Technique 1"]=await spinWheel("Cursed Technique",1000);
  await new Promise(r=>setTimeout(r,150));
  build["Cursed Technique 2"]=await spinWheel("Cursed Technique",1000);
  await new Promise(r=>setTimeout(r,150));
  build["Cursed Technique 3"]=await spinWheel("Cursed Technique",1000);
  showFinal();
};

function showFinal(){
  const out=document.getElementById("results");out.innerHTML="";
  Object.keys(data).forEach(name=>{
    if(name==="Cursed Technique")return;
    const d=document.createElement("div");d.className="r";
    d.innerHTML="<small>"+name+"</small><strong>"+(build[name]||"Not spun")+"</strong>";out.appendChild(d);
  });
  ["Cursed Technique 1","Cursed Technique 2","Cursed Technique 3"].forEach(name=>{
    const d=document.createElement("div");d.className="r";
    d.innerHTML="<small>"+name+"</small><strong>"+(build[name]||"Not spun")+"</strong>";out.appendChild(d);
  });
  document.getElementById("final").style.display="block";
}
document.getElementById("back").onclick=()=>document.getElementById("final").style.display="none";
document.getElementById("newBuild").onclick=()=>{
  Object.keys(build).forEach(k=>delete build[k]);
  document.getElementById("final").style.display="none";
  select("Characters");
};
document.getElementById("apply").onclick=()=>{
  const list=entriesBox.value.split("\n").map(x=>x.trim()).filter(Boolean);
  if(list.length){data[current]=list;draw();}
};
document.getElementById("reset").onclick=()=>{data[current]=[...DEFAULTS[current]];select(current);};
document.getElementById("fullBtn").onclick=async()=>{
  try{
    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
};

makeTabs();select("Characters");
</script>
</body>
</html>
